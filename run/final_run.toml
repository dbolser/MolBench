# MolBench final run - the one file the run depends on.
#
#   python -m molbench.runner --manifest run/final_run.toml --dry-run   # rehearse, $0
#   python -m molbench.runner --manifest run/final_run.toml             # plan + cost only
#   python -m molbench.runner --manifest run/final_run.toml --go        # the paid run
#   python scripts/estimate_cost.py --tasks mvs=450 api_calling=250     # cost of a planned corpus
#
# The paid run refuses to start until corpus.sha256 is pinned and matches tasks/ on disk.

[run]
name = "final-v1"                   # archive: runs/final-v1/   scorecards: results/final-v1/
samples = 3                         # per task, per model, per condition (plan decision 12)
max_tokens = 8000                   # output limit per call (October used 2000, with no record
                                    # of how often it truncated; finish reasons are now archived)
reasoning_max_tokens = 16000        # for models flagged reasoning = true (hidden reasoning is
                                    # billed as output and counts against the limit)
temperature = "provider-default"    # no temperature is ever sent (plan decision 12)
concurrency = 8                     # calls in flight, all models together
per_model_concurrency = 2           # calls in flight to any one model
validate = "required"               # Mol* must validate every parsed scene (needs the 'execute'
                                    # extra + the Mol* bundle); "auto" in a dry run

[run.retry]
max_attempts = 5                    # per call; 400/401/402/403/404/422 are not retried
backoff_seconds = 2.0               # 2, 4, 8, 16 s ...
backoff_max_seconds = 60.0
timeout_seconds = 300.0
# A call that fails every attempt is logged to runs/<name>/errors.jsonl and is NOT archived,
# so the next start of the same command tries it again.

[budget]
cap_usd = 120.00
note = """Hard stop. The run aborts before the first call if the plan is projected above \
the cap, and mid-run as soon as (spent + estimated cost of the calls still to make) passes it. \
NOT YET SIZED FOR THE FINAL CORPUS: on 2026-11-12 the 17-entry core panel was projected at $19 \
on today's 90 tasks and at $141 on a corpus of 450 MVS + 250 API tasks (scripts/estimate_cost.py \
--core-only --tasks mvs=450 api_calling=250), so at that size the run refuses to start until \
this cap is raised or the plan is trimmed (gemini-3.5-flash is $57 of the $141; the JSON-mode \
condition is nearly half of every model's cost). The five optional models would add about $388. \
Set the cap deliberately once the corpus is frozen."""

[corpus]
version = "corpus-v1.0-dev"         # becomes "corpus-v1.0" at the freeze
sha256 = ""                         # pin at the freeze: python -m molbench.manifest
note = "SHA-256 over every tasks/**/*.json (sorted path + content). Empty = not frozen yet."

# ---------------------------------------------------------------------------------------
# Conditions (plan decisions 10 and 11). Listed in the order they are run.
# ---------------------------------------------------------------------------------------
# How task tiers map to conditions:
#   spec             every tier, both tracks, both splits (public and held-back are run
#                    identically; scorecards report them apart, by_split)
#   spec_structured  the same tasks, JSON mode on
#   spec_grounded    tiers resolve and clinical only, MVS track, tasks with a grounding pack
#   bare             every MVS tier, three models
# Follow-up, accept-set, twin and paraphrase tasks need no condition of their own: they are
# ordinary tasks of the spec conditions (a follow-up's start state is part of its request).
[[conditions]]
name = "spec"
prompt = "spec"
models = "all"
tracks = ["mvs", "api_calling"]
note = "Headline: system prompt with the vendored reference; every model, both tracks."

[[conditions]]
name = "spec_structured"
prompt = "spec"
structured = true
models = "structured"
tracks = ["mvs", "api_calling"]
note = """Same prompt with the provider's JSON mode switched on, for every model whose route \
supports it. On the API track JSON mode must return an object, so one fixed sentence asks for \
{"actions": [...]} (runner.API_STRUCTURED_SUFFIX)."""

[[conditions]]
name = "spec_grounded"
prompt = "spec"
grounding = true
models = "all"
tracks = ["mvs"]
where = { tier = ["resolve", "clinical"] }
note = """Ablation: the task's frozen grounding pack appended to the user message, on the \
lookup tiers only (molbench.tasks.LOOKUP_TIERS: tasks whose answer needs a fact from outside \
the request, and that carry a pack). No other tier is given a pack in any condition."""

[[conditions]]
name = "bare"
prompt = "bare"
models = ["claude-haiku-4-5", "deepseek/deepseek-v3.2", "qwen/qwen3-30b-a3b-instruct-2507"]
tracks = ["mvs"]
note = "Output contract only, no MVS reference. Three models (the same three as October)."

# ---------------------------------------------------------------------------------------
# Model panel (plan decision 22). The rule, then the entries it gives.
# ---------------------------------------------------------------------------------------
[panel]
rule = """(1) Every open-weight and closed model on the published leaderboard \
(docs/scorecard.json, October 2026) stays, on the route it was run on, so the final numbers \
can be compared with the earlier ones. (2) The keyword baseline (no model; fixed rules in \
molbench/models.py) is a panel member on both tracks. (3) Optional entries: the current \
flagship model of each major lab on OpenRouter's public list on the price date, plus the \
largest model there with public weights; they run only with --include-optional. No model is \
added or dropped after results are seen."""

[[models]]
id = "baseline-rules"
route = "baseline"                     # molbench.models.BaselineModel: keyword rules, no call
open_weights = false                   # not a model at all
reasoning = false
structured = "none"
reason = "Score floor on both tracks: what keyword matching alone achieves."
price = { input = 0.0, output = 0.0, source = "runs locally; no provider is called", date = "2026-11-12", verified = true }

# ---------------------------------------------------------------------------------------
# The 16 models of the current leaderboard (docs/scorecard.json).
#
# price: USD per 1,000,000 tokens. OpenRouter prices were read from its public model list
# (no key needed) on the date given. OpenRouter bills at the rate of the provider that
# serves each call, which can differ from the listed rate; the runner asks OpenRouter for
# the billed cost of every call and uses that for the budget when it is returned.
# open_weights: the listing names a Hugging Face repository for the model.
# reasoning: spends hidden reasoning tokens by default (billed as output).
# structured: how JSON mode is requested; "none" = left out of structured conditions.
# ---------------------------------------------------------------------------------------
[[models]]
id = "claude-haiku-4-5"
route = "anthropic:claude-haiku-4-5"   # native API, as in every earlier run
open_weights = false
reasoning = false
