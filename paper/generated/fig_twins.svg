<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 456" width="660" height="456" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The paired design: one request, two answer formats, the same target atoms">
<title>The paired design: one request, two answer formats, the same target atoms</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="660" height="456" fill="#ffffff"/>
<rect x="10" y="8" width="640" height="58" rx="6" fill="#d3e4f1" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="330.0" y="24" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Request (identical on both tracks)</text>
<text x="330.0" y="40" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle" font-style="italic">“PDB entry 2NWD: the LYZ (Lysozyme C, UniProt P61626) variant p.W82R is classified as pathogenic in ClinVar. Show the</text>
<text x="330.0" y="53" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle" font-style="italic">residue it replaces as yellow spacefill spheres.”</text>
<line x1="270.0" y1="67" x2="207.0" y2="86" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="390.0" y1="67" x2="453.0" y2="86" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="10" y="88" width="314" height="150" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="20" y="107" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Scene track: a MolViewSpec scene (declarative)</text>
<rect x="336" y="88" width="314" height="150" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="346" y="107" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Call-list track: PDBe Mol* viewer calls (imperative)</text>
<text x="20" y="126" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">download  files.rcsb.org/download/2nwd.cif</text>
<text x="20" y="139" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve"> parse  mmcif</text>
<text x="20" y="152" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">  structure  model</text>
<text x="20" y="165" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">   component  auth_asym_id = X,</text>
<text x="20" y="178" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">              auth_seq_id = 64</text>
<text x="20" y="191" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">    representation  spacefill</text>
<text x="20" y="204" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">     color  yellow</text>
<text x="20" y="217" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">The model must turn UniProt 82 into author residue 64</text>
<text x="20" y="230" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">itself.</text>
<text x="346" y="126" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">load   molecule_id = 2nwd</text>
<text x="346" y="139" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">color  uniprot_accession = P61626,</text>
<text x="346" y="152" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">       uniprot_residue_number = 82,</text>
<text x="346" y="165" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">       representation = spacefill,</text>
<text x="346" y="178" font-size="9.5" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" xml:space="preserve">       representationColor = yellow</text>
<text x="346" y="217" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">The viewer does the mapping; the model only passes on the</text>
<text x="346" y="230" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">accession and the position.</text>
<line x1="167.0" y1="239" x2="250.0" y2="262" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="493.0" y1="239" x2="410.0" y2="262" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="115.0" y="264" width="430" height="42" rx="6" fill="#e6f4ef" stroke="#009E73" stroke-width="1.5"/>
<text x="330.0" y="282" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Both references resolve to the same target atoms</text>
<text x="330.0" y="297" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">Trp64, chain X of 2NWD: 24 atoms (checked when the task is built)</text>
<line x1="330.0" y1="307" x2="330.0" y2="324" stroke="#555555" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="10" y="348" font-size="10.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Per model, every pair falls into one of four cells.</text>
<text x="10" y="364" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">A side is right when at least 2 of its 3 answers are</text>
<text x="10" y="377" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">target-right. Counted over the 250 pairs that have a</text>
<text x="10" y="390" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">target score; repeated with task success over all</text>
<text x="10" y="403" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">258 pairs.</text>
<text x="361.0" y="340" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">call list right</text>
<text x="503.0" y="340" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">call list wrong</text>
<rect x="290" y="346" width="142" height="30" rx="0" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="361.0" y="365" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle">right on both sides</text>
<rect x="432" y="346" width="142" height="30" rx="0" fill="#d9e9f4" stroke="#8a8a8a" stroke-width="1.0"/>
<rect x="432" y="346" width="7" height="30" fill="#0072B2"/>
<text x="506.0" y="365" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle">right in the scene only</text>
<rect x="290" y="376" width="142" height="30" rx="0" fill="#fbecc8" stroke="#8a8a8a" stroke-width="1.0"/>
<rect x="290" y="376" width="7" height="30" fill="#E69F00"/>
<text x="364.0" y="395" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle">right in the call list only</text>
<rect x="432" y="376" width="142" height="30" rx="0" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="503.0" y="395" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="middle">right on neither side</text>
<text x="582" y="365" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">scene right</text>
<text x="582" y="395" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">scene wrong</text>
<text x="432" y="424" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">McNemar's test compares the two coloured cells</text>
<text x="432" y="437" font-size="10" font-weight="normal" fill="#555555" text-anchor="middle">(right in one format only).</text>
</svg>
