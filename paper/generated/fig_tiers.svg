<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 554" width="660" height="554" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="The eight categories of task, each with one request from the corpus">
<title>The eight categories of task, each with one request from the corpus</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="660" height="554" fill="#ffffff"/>
<text x="10" y="20" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Counts: tasks on the scene track / on the call-list track. Requests are quoted from the corpus.</text>
<text x="10" y="46" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Differ in what the model must know</text>
<text x="336" y="46" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Differ in the form of the task</text>
<rect x="10" y="56" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="20" y="75" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Translation</text>
<text x="314" y="75" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">73 / 178</text>
<text x="20" y="91" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Everything is in the request.</text>
<text x="20" y="107" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“3ERT: grey cartoon, and the het group OHT as lime green</text>
<text x="20" y="120" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">ball-and-stick.”</text>
<rect x="10" y="172" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="20" y="191" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Structure-grounded</text>
<text x="314" y="191" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">63 / 63</text>
<text x="20" y="207" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">A feature is named; the model must know its atoms.</text>
<text x="20" y="223" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“In 1STP, draw the protein as a grey cartoon and pick out</text>
<text x="20" y="236" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">the biotin in green ball-and-stick.”</text>
<rect x="10" y="288" width="314" height="104" rx="6" fill="#d3e4f1" stroke="#0072B2" stroke-width="1.8"/>
<text x="125.0" y="307" font-size="9.5" font-weight="bold" fill="#0072B2" text-anchor="start">lookup category</text>
<text x="20" y="307" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Name resolution</text>
<text x="314" y="307" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">39 / –</text>
<text x="20" y="323" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">The protein is named; the entry is not.</text>
<text x="20" y="339" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“Show me a structure of the protein encoded by the human</text>
<text x="20" y="352" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">gene HRAS, as a blue cartoon.”</text>
<rect x="10" y="404" width="314" height="104" rx="6" fill="#d3e4f1" stroke="#0072B2" stroke-width="1.8"/>
<text x="131.6" y="423" font-size="9.5" font-weight="bold" fill="#0072B2" text-anchor="start">lookup category</text>
<text x="20" y="423" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Clinical variant</text>
<text x="314" y="423" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">82 / 82</text>
<text x="20" y="439" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">The residue must be found in the structure; copying the</text>
<text x="20" y="452" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">number in its name is wrong in 48 of 82 tasks.</text>
<text x="20" y="468" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“PDB entry 2NWD: the LYZ (Lysozyme C, UniProt P61626)</text>
<text x="20" y="481" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">variant p.W82R is classified as pathogenic in ClinVar.</text>
<text x="20" y="494" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">Show the residue it replaces as yellow spacefill spheres.”</text>
<rect x="336" y="56" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="346" y="75" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Interactions</text>
<text x="640" y="75" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">40 / –</text>
<text x="346" y="91" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Named atoms and a measurement.</text>
<text x="346" y="107" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“9FB2, hot pink cartoon; how far apart are the C-alpha</text>
<text x="346" y="120" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">atoms of Pro189 and Phe436? Draw the distance as a</text>
<text x="346" y="133" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">labelled dashed line.”</text>
<rect x="336" y="172" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="346" y="191" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Follow-up turn</text>
<text x="640" y="191" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">58 / 44</text>
<text x="346" y="207" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">A start state plus an edit.</text>
<text x="346" y="223" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“[start: a scene with one magenta chain] Make the magenta</text>
<text x="346" y="236" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">chain plum.”</text>
<rect x="336" y="288" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="346" y="307" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Several right answers</text>
<text x="640" y="307" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">26 / 15</text>
<text x="346" y="323" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">One countable thing is left open.</text>
<text x="346" y="339" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“Show 4INS with the protein as a cartoon. Colour Lys29</text>
<text x="346" y="352" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">yellow.”</text>
<rect x="336" y="404" width="314" height="104" rx="6" fill="#f3f5f7" stroke="#8a8a8a" stroke-width="1.0"/>
<text x="346" y="423" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="start">Viewer settings</text>
<text x="640" y="423" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="end">– / 34</text>
<text x="346" y="439" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Call-list track only.</text>
<text x="346" y="455" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">“Load 1UDT on a black background with glossy lighting and</text>
<text x="346" y="468" font-size="10" font-weight="normal" fill="#1a1a1a" text-anchor="start" font-style="italic">set it spinning.”</text>
<text x="10" y="526" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">Blue frame: the two lookup categories. The answer needs one piece of information that a person would look up (an entry, a</text>
<text x="10" y="539" font-size="10" font-weight="normal" fill="#555555" text-anchor="start">residue number); the model must recall it.</text>
</svg>
